[package]
name = "quantik-api"
version = "0.1.0"
edition = "2021"
description = "HTTP engine gateway for Quantik core engines."
license = "MIT"
publish = false

[dependencies]
axum = "0.8"
quantik-core = { path = "../quantik-core" }
serde = { version = "1", features = ["derive"] }
tokio = { version = "1", features = ["macros", "net", "rt-multi-thread", "signal"] }
tower-http = { version = "0.6", features = ["cors", "trace"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[dev-dependencies]
http-body-util = "0.1"
serde_json = "1"
tower = { version = "0.5", features = ["util"] }
